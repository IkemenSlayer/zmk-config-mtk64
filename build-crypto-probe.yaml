  - board: xiao_ble//zmk
    shield: mtk64_DONGLE rgbled_adapter dongle_display
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_BLE=y -DCONFIG_ZMK_SPLIT_ESB_USE_TIMESLOT=y -DCONFIG_MPSL_TIMESLOT_SESSION_COUNT=2 -DCONFIG_BT_MAX_PAIRED=1 -DCONFIG_BT_MAX_CONN=1 -DCONFIG_NRF_SECURITY=n -DCONFIG_NORDIC_SECURITY_BACKEND=n
